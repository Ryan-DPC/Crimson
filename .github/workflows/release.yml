name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

  publish:
    needs: build-frontend
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - name: Install Tauri CLI
        run: npm ci
        working-directory: apps/desktop
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Crimson ${{ github.ref_name }}'
          releaseBody: |
            ## ⚡ Crimson ${{ github.ref_name }}
            
            Cette version améliore l'intégration avec Windows et les temps de build :
            - **Performance** : Temps de compilation divisé par ~2.
            - **Zone de notification** : Choix entre fermer l'app ou la réduire dans la tray.
            - **Démarrage automatique** : Nouvelle option pour lancer Crimson au démarrage de Windows.
            - **Notifications natives** : Alertes Windows lorqu'un match est accepté.
            - **Mémoire de la fenêtre** : L'app retient sa position et sa taille (geometry).
            - **Correctif Shutdown** : L'application ne bloque plus l'extinction du PC.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
