name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CACHE_VERSION: v1

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

  publish:
    needs: [build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Build Sidecar (In-place)
        run: cargo build -p phantom_server --release
        working-directory: apps/desktop/src-tauri

      - name: Prepare Sidecar
        run: |
          mkdir bin
          cp target/release/phantom_server.exe bin/phantom_server-x86_64-pc-windows-msvc.exe
        working-directory: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm ci
        working-directory: apps/desktop
      
      - name: Build Tauri app (Cache only)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Release Tauri app
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Crimson ${{ github.ref_name }}'
          releaseBody: |
            ## ⚡ Crimson ${{ github.ref_name }}
            
            Cette version finalise la migration vers l'architecture **Sidecar** :
            - **Optimisation Massive du Build** : Temps de compilation réduit de ~60% grâce à la consolidation des jobs.
            - **Isolation Processus** : Le serveur background est désormais totalement indépendant de l'UI.
            - **Auto-Update** : Notifications interactives et barre de progression améliorées.
            - **Stabilité** : Correction des fuites mémoire et des crashs au démarrage.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
