name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

  build-sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: sidecar-cache
          workspaces: |
            apps/desktop/src-tauri/crates/phantom_server -> target
      - name: Build Sidecar
        run: cargo build -p phantom_server --release
        working-directory: apps/desktop/src-tauri
      - name: Prepare Sidecar
        run: |
          mkdir bin
          cp target/release/phantom_server.exe bin/phantom_server-x86_64-pc-windows-msvc.exe
        working-directory: apps/desktop/src-tauri
      - name: Upload Sidecar
        uses: actions/upload-artifact@v4
        with:
          name: phantom-sidecar
          path: apps/desktop/src-tauri/bin/phantom_server-x86_64-pc-windows-msvc.exe

  publish:
    needs: [build-frontend, build-sidecar]
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: phantom-sidecar
          path: apps/desktop/src-tauri/bin
      - name: Install Tauri CLI
        run: npm ci
        working-directory: apps/desktop
      
      - name: Build Tauri app (Cache only)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Release Tauri app
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Crimson ${{ github.ref_name }}'
          releaseBody: |
            ## ⚡ Crimson ${{ github.ref_name }}
            
            Cette version introduit une architecture **Sidecar** pour des performances de build optimales :
            - **Build Parallèle** : Temps de compilation réduit de ~50%.
            - **Isolation Processus** : Le serveur background est désormais indépendant du shell UI.
            - **Stabilité Tray** : Correction définitive du bug de visibilité dans la barre des tâches.
            - **Auto-Update** : Notifications interactives et barre de progression.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
