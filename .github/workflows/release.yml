name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CACHE_VERSION: v1

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

  publish:
    needs: [build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Build Sidecar (In-place)
        run: cargo build -p crimson-server --release
        working-directory: apps/desktop/src-tauri

      - name: Prepare Sidecar
        run: |
          mkdir bin
          cp target/release/crimson-server.exe bin/crimson-server-x86_64-pc-windows-msvc.exe
        working-directory: apps/desktop/src-tauri

      - name: Install Tauri CLI
        run: npm ci
        working-directory: apps/desktop
      
      - name: Build Tauri app (Cache only)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri app
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run tauri build
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Build Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ls -R src-tauri/target/release/bundle
          ls -R src-tauri/target/release/*.json || true
        working-directory: apps/desktop

      - name: Release v2.1.0
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'Crimson ${{ github.ref_name }}'
          tag_name: ${{ github.ref_name }}
          body: |
            ## ⚡ Crimson ${{ github.ref_name }}
            
            Cette version contient le correctif définitif pour l'Auto-Updater :
            - **Signature Verifiée** : Nouvelle paire de clés Minisign pour un updater fiable.
            - **Monitoring Temps Réel** : Nouveaux indicateurs SERVER et LEAGUE dans l'en-tête.
            - **Performance** : Build optimisé et sidecar consolidé.
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.zip*
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.zip*
            apps/desktop/src-tauri/target/release/latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
