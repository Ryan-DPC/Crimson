name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CACHE_VERSION: v2

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crimson/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: crimson
      - name: Build frontend
        run: npm run build
        working-directory: crimson
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crimson/dist

  publish:
    needs: [build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crimson/package-lock.json
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}
          # Workspace Cargo unique a la racine : crimson/src-tauri, server et
          # lcu_commands partagent le meme dossier target/.
          workspaces: |
            . -> target

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crimson/dist

      - name: Build Sidecar
        run: cargo build -p crimson-server --release

      - name: Prepare Sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crimson/src-tauri/bin | Out-Null
          Copy-Item target/release/crimson-server.exe crimson/src-tauri/bin/crimson-server-x86_64-pc-windows-msvc.exe -Force

      - name: Install Tauri CLI
        run: npm ci
        working-directory: crimson

      - name: Build Tauri app (Cache only)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri build
        working-directory: crimson
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app (Signed Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run tauri build
        working-directory: crimson
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate Auto-Updater Metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content crimson/package.json | ConvertFrom-Json).version

          # Le tag doit correspondre a la version des manifestes, sinon
          # l'URL ecrite dans latest.json pointe vers une release inexistante.
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") {
            Write-Error "Tag $tag incoherent avec la version $v de crimson/package.json"
            exit 1
          }

          $exe = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Aucun installeur NSIS produit"; exit 1 }

          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            Write-Error "Signature absente : verifiez le secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          }
          $sig = (Get-Content $sigPath | Select-Object -Last 1).Trim()

          Write-Host "latest.json pour la version $v, installeur $($exe.Name)"

          $latest = @{
              version = $v
              notes = "Crimsons $tag"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                  "windows-x86_64" = @{
                      signature = $sig
                      url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
                  }
              }
          }
          $latest | ConvertTo-Json -Depth 10 | Set-Content "target/release/latest.json" -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'Crimsons ${{ github.ref_name }}'
          tag_name: ${{ github.ref_name }}
          # Le corps rédigé s'affiche au-dessus des notes générées par GitHub.
          # Sans lui, la rupture Spotify passerait inaperçue dans une simple
          # liste de commits en anglais.
          generate_release_notes: true
          body: |
            ## Action requise après la mise à jour

            **Votre intégration Spotify cessera de fonctionner tant que vous n'aurez pas renseigné vos propres identifiants.**

            Crimsons ne fournit plus d'identifiants Spotify partagés : chaque installation utilise désormais sa propre application Spotify. Les vôtres restent sur votre machine et ne sont transmis à personne.

            ### Reconnecter Spotify en 4 étapes

            1. Ouvrez le [tableau de bord développeur Spotify](https://developer.spotify.com/dashboard) et créez une application
            2. Dans ses paramètres, déclarez l'URL de redirection : `http://127.0.0.1:40510/callback`
            3. Copiez son **Client ID** et son **Client Secret**
            4. Dans Crimsons, allez dans **Paramètres → Spotify**, collez-les, puis cliquez sur **Associer Spotify**

            Le reste de l'application n'est pas affecté : coach de draft, Discord, Twitch, Hue et Stream Deck continuent de fonctionner normalement.

            ---
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
