[package]
name = "crimson_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "crimson_server"
path = "src/main.rs"

[dependencies]
lcu_commands = { path = "../lcu_commands" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustls = "0.22"
http = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.30"
single-instance = "0.3"
