[package]
name = "crimson-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "crimson-server"
path = "src/main.rs"

[dependencies]
lcu_commands = { path = "../lcu_commands" }
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rustls = "0.22"
http = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
single-instance = "0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"         # Optimize for size
lto = "fat"             # Link-Time Optimization (full)
codegen-units = 1       # Slower compile, better optimization
panic = "abort"         # Strip unwinding code
strip = true            # Strip symbols
